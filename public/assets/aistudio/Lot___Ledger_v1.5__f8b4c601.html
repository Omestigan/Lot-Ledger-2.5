td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}

async function packState(){const o=JSON.parse(JSON.stringify(S));let j=JSON.stringify(o);
  async function gz(str){if(typeof CompressionStream==='undefined')return null;const cs=new CompressionStream('gzip'),w=cs.writable.getWriter();w.write(new TextEncoder().encode(str));w.close();
    const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());let b='';for(let i=0;i<buf.length;i+=8192)b+=String.fromCharCode.apply(null,buf.subarray(i,i+8192));return btoa(b)}
  let z=await gz(j);if(z==null)return{enc:'raw',d:j.length<240000?j:JSON.stringify(Object.assign(o,{listings:[],imports:[]}))};
  if(z.length>240000){o.listings=[];o.imports=[];z=await gz(JSON.stringify(o))}return{enc:'gz',d:z}}

function act(a,id,v){const L=UI.sel&&UI.sel.t==='L'?LB(UI.sel.id):null,C=UI.sel&&UI.sel.t==='C'?CB(UI.sel.id):null;
  if(S.over&&a!=='newgame'&&a!=='menu'&&a!=='tab')return;
  switch(a){
  case 'tab':UI.tab=v;UI.sel=null;UI.flash=[];break;
  case 'menu':UI.menu=!UI.menu;break;
  case 'newgame':UI.start=true;UI.menu=false;UI.pickReg=UI.pickReg||RG.id;UI.pickMode=S.mode;break;
  case 'pskin':UI.pl.skin=+v;break;
  case 'phair':UI.pl.hair=+v;break;
  case 'pstyle':UI.pl.style=+v;break;
  case 'pshirt':UI.pl.shirt=+v;break;
  case 'pbg':UI.pl.bg=v;break;
  case 'pickreg':UI.pickReg=v;break;
  case 'pickmode':UI.pickMode=v;break;
  case 'begin':startGame(UI.pickReg||'qc',UI.pickMode||'free');return;
  case 'resume':UI.start=false;break;
  case 'theme':cycleTheme();return;
  case 'csave':saveCloud(+v);return;
  case 'cload':loadCloud(+v);return;
  case 'cdel':delCloud(+v);return;
  case 'cauto':CLOUD.auto=!CLOUD.auto;setPref('cloudauto',CLOUD.auto?'1':'0');break;
  case 'ibuy':invBuy(v,+UI.iamt);break;
  case 'isell':invSell(v,+UI.iamt);break;
  case 'isellall':invSell(v,0,true);break;
  case 'auto':S.auto=!S.auto;break;
  case 'intv':interview(+id);break;
  case 'hire':hireCand(+id,v);break;
  case 'fire':fireEmp(+id);break;
  case 'raise':raiseAct(+id,v==='1');break;
  case 'renew':renewAct(+id,v==='1');break;
  case 'dd':dueDiligence(+id);break;
  case 'angel':angelInvest(+id,v==='1');break;
  case 'suitf':C&&fileSuit(C.uid,v);break;
  case 'counsel':case 'settle':case 'go':case 'drop':suitAct(+id,a,v);break;
  case 'iorder':L&&importOrder(L);break;
  case 'impi':L&&impInspect(L);break;
  case 'export':C&&exportCar(C.uid,v);break;
  case 'swt':{const o=S.offers.find(x=>x.id===+id);if(o)swapTool(o,v)}break;
  case 'syes':offerAct(+id,'yes');break;
  case 'sctr':offerAct(+id,'ctr');break;
  case 'sno':offerAct(+id,'no');break;
  case 'selL':UI.sel={t:'L',id:+id};UI.flash=[];UI.offer='';break;
  case 'selC':UI.sel={t:'C',id:+id};UI.flash=[];UI.sell={ask:'',disc:true,ad:0};break;
  case 'close':UI.sel=null;break;
  case 'endday':endDay();flash('A new day. '+S.listings.length+' listings on the board.');break;
  case 'wait7':for(let i=0;i<7;i++)endDay();flash('A week passes.');break;
  case 'fsrc':UI.filt.src=v;break;
  case 'say':L&&say(L,v);break;
  case 'meet':L&&meet(L);break;

  case 'buy':L&&buy(L,v);break;
  case 'diag':C&&diagnose(C);break;

  case 'body':if(C){const p=v.split(':');bodyFix(C,p[0],p[1])}break;
  case 'reg':C&&register(C);break;
  case 'lien':C&&payLien(C);break;
  case 'tires':C&&tires(C);break;
  case 'winter':C&&winterSet(C);break;
  case 'detail':C&&detail(C,v);break;
  case 'recall':C&&recall(C);break;
  case 'parts':UI.parts=v;break;
  case 'ad':UI.sell.ad=+v;break;
  case 'disc':UI.sell.disc=!UI.sell.disc;break;
  case 'list':C&&listCar(C);break;
  case 'unlist':if(C){C.sale=null;flash('Taken off the market.')}break;
  case 'wholesale':C&&wholesale(C);break;
  case 'scrap':C&&scrapCar(C);break;
  case 'partout':C&&partOut(C);break;
  case 'oyes':offerAct(+id,'yes');break;
  case 'octr':offerAct(+id,'ctr');break;
  case 'ono':offerAct(+id,'no');break;
  case 'insure':if(v==='on'){const c=insM();if(S.cash<c)flash('Not enough cash.');else{S.cash-=c;S.ins=true;log('Insurance, first month',-c);flash('Insured.')}}else{S.ins=false;S.cars.forEach(c=>{});flash('Policy cancelled. You cannot test drive or drive a registered car.')}break;
  case 'tool':{const p=v==='obd'?70:120;if(S.cash<p)flash('Not enough cash.');else{S.cash-=p;S.tools[v]=true;log('Bought '+(v==='obd'?'OBD-II scanner':'compression kit'),-p)}}break;
  case 'slot':if(S.cash<150)flash('Need $150.');else{S.cash-=150;S.slots++;log('Rented parking spot',-150)}break;
  case 'loan':if(S.debt+ +v>loanLimit()){flash('Your credit limit is '+fmt(loanLimit())+'.');break}S.cash+=+v;S.debt+=+v;log('Loan taken',+v);break;
  case 'repay':{const x=Math.min(S.cash,S.debt);S.cash-=x;S.debt-=x;log('Loan repayment',-x)}break;
  case 'lic':S.cash-=3000;S.lic=true;log('Dealer licence',-3000);flash('You are now a licensed dealer.');break;
  case 'partner':S.partners[v]=true;flash('Partnership agreed.');break;
  }
  checkEnd();render()}
